name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: operations-insights-website
  CLOUDFRONT_DISTRIBUTION_ID: E2WKBNAIIKOEBD

jobs:
  deploy:
    name: Sync to S3 and invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync site files to S3
        # must-revalidate: the filenames are not content-hashed, so browsers
        # have to check with the origin instead of serving a stale styles.css
        # or script.js from their own cache after a deploy.
        run: |
          aws s3 sync . "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude ".DS_Store" \
            --exclude "google-apps-script.gs" \
            --exclude "*.md"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Created invalidation ${INVALIDATION_ID}"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"
          echo "Invalidation complete"

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://www.operations-insights.in/)
          echo "https://www.operations-insights.in/ returned ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "::error::Live site did not return 200"
            exit 1
          fi
